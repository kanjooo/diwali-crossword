<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="same-origin">
  <title>Teacher dashboard | Deeponomics</title>
  <style>
    :root { --ink:#29110d; --mut:#735d54; --paper:#fffdf8; --line:#dfd3c2; --red:#a52828; --navy:#24364c; --ok:#227447; }
    * { box-sizing:border-box; } body { margin:0; min-height:100vh; background:#f7f1e6; color:var(--ink); font-family:system-ui,sans-serif; }
    main { width:min(1180px,calc(100% - 32px)); margin:44px auto; } .card { background:var(--paper); border:1px solid var(--line); border-radius:16px; padding:28px; box-shadow:0 8px 32px #2e160b12; }
    h1 { font:700 clamp(1.8rem,4vw,2.6rem) Georgia,serif; margin:0 0 8px; color:var(--navy); } p { color:var(--mut); } form { max-width:420px; display:grid; gap:14px; margin-top:22px; } label { display:grid; gap:6px; font-weight:650; } input { border:1px solid var(--line); border-radius:8px; padding:11px; font:inherit; }
    button { border:0; border-radius:8px; padding:11px 16px; font:700 0.95rem system-ui; cursor:pointer; background:var(--red); color:#fff; } button.secondary { background:#fff; color:var(--navy); border:1px solid var(--line); } .toolbar { display:flex; justify-content:space-between; align-items:center; gap:16px; margin-bottom:18px; flex-wrap:wrap; } .actions { display:flex; gap:8px; flex-wrap:wrap; }
    .error { color:#9f1d1d; min-height:1.3em; } .hidden { display:none!important; } .loading { color:var(--mut); } .table-wrap { overflow:auto; border:1px solid var(--line); border-radius:10px; } table { border-collapse:collapse; width:100%; min-width:900px; } th,td { text-align:left; padding:10px 12px; border-bottom:1px solid var(--line); font-size:.9rem; } th { background:#f4ecdf; } tr:last-child td { border:0; } .badge { color:#fff; background:var(--ok); border-radius:99px; padding:2px 7px; font-weight:700; white-space:nowrap; }
  </style>
</head>
<body>
  <main>
    <section id="login-view" class="card">
      <h1>Teacher login</h1>
      <p>Sign in with the teacher account created by your school administrator.</p>
      <form id="login-form">
        <label>Email address <input id="email" type="email" autocomplete="email" required></label>
        <label>Password <input id="password" type="password" autocomplete="current-password" required></label>
        <p class="error" id="login-error" role="alert"></p>
        <button type="submit">Sign in</button>
      </form>
    </section>

    <section id="dashboard-view" class="card hidden" aria-live="polite">
      <div class="toolbar">
        <div><h1>Teacher dashboard</h1><p id="summary">Loading participant records…</p></div>
        <div class="actions"><input id="dashboard-search" type="search" placeholder="Search name, school, city…" aria-label="Search participant records"><button class="secondary" id="export" type="button">Export CSV</button><button id="logout" type="button">Log out</button></div>
      </div>
      <p class="error" id="dashboard-error" role="alert"></p>
      <div class="table-wrap">
        <table><thead><tr><th>Name</th><th>Class</th><th>School</th><th>City</th><th>Email</th><th>Score</th><th>%</th><th>Time</th><th>Submitted</th></tr></thead><tbody id="attempts"></tbody></table>
      </div>
    </section>
  </main>

  <script type="module">
    import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

    const loginView = document.querySelector("#login-view");
    const dashboardView = document.querySelector("#dashboard-view");
    const loginError = document.querySelector("#login-error");
    const dashboardError = document.querySelector("#dashboard-error");
    let supabase;
    let attempts = [];
    let filteredAttempts = [];

    const escapeHtml = (value) => {
      const node = document.createElement("span");
      node.textContent = value ?? "";
      return node.innerHTML;
    };
    const time = (seconds) => `${String(Math.floor((Number(seconds) || 0) / 60)).padStart(2, "0")}:${String((Number(seconds) || 0) % 60).padStart(2, "0")}`;

    function renderAttempts() {
      const query = document.querySelector("#dashboard-search").value.trim().toLowerCase();
      filteredAttempts = attempts.filter((attempt) => !query || [attempt.name, attempt.class_name, attempt.school_name, attempt.city, attempt.email].some((value) => String(value || "").toLowerCase().includes(query)));
      document.querySelector("#summary").textContent = `${filteredAttempts.length} of ${attempts.length} submission${attempts.length === 1 ? "" : "s"}`;
      document.querySelector("#attempts").innerHTML = filteredAttempts.map((attempt) => {
        const score = Number(attempt.score) || 0;
        return `<tr><td>${escapeHtml(attempt.name)}</td><td>${escapeHtml(attempt.class_name)}</td><td>${escapeHtml(attempt.school_name)}</td><td>${escapeHtml(attempt.city || "-")}</td><td>${escapeHtml(attempt.email)}</td><td><span class="badge">${score} / 16</span></td><td>${Math.round((score / 16) * 100)}%</td><td>${time(attempt.seconds)}</td><td>${escapeHtml(new Date(attempt.submitted_at).toLocaleString("en-IN"))}</td></tr>`;
      }).join("") || "<tr><td colspan=\"9\">No submissions match this search.</td></tr>";
    }

    async function loadDashboard(session) {
      loginView.classList.add("hidden");
      dashboardView.classList.remove("hidden");
      dashboardError.textContent = "";
      const response = await fetch("/api/scores", { headers: { Authorization: `Bearer ${session.access_token}` } });
      if (response.status === 401) {
        await supabase.auth.signOut();
        showLogin("Your session expired. Please sign in again.");
        return;
      }
      if (response.status === 403) {
        await supabase.auth.signOut();
        showLogin("This account is not authorised to view teacher records.");
        return;
      }
      if (!response.ok) throw new Error("Unable to load participant records.");
      attempts = await response.json();
      renderAttempts();
    }

    function showLogin(message = "") {
      dashboardView.classList.add("hidden");
      loginView.classList.remove("hidden");
      loginError.textContent = message;
      document.querySelector("#password").value = "";
    }

    async function initialise() {
      try {
        const configResponse = await fetch("/api/auth-config");
        if (!configResponse.ok) throw new Error("Teacher login is not configured.");
        const { supabaseUrl, supabaseAnonKey } = await configResponse.json();
        supabase = createClient(supabaseUrl, supabaseAnonKey);
        const { data: { session } } = await supabase.auth.getSession();
        if (session) await loadDashboard(session); else showLogin();
      } catch (error) { showLogin(error.message || "Unable to start teacher login."); }
    }

    document.querySelector("#login-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      loginError.textContent = "";
      const button = event.currentTarget.querySelector("button"); button.disabled = true;
      try {
        const { data, error } = await supabase.auth.signInWithPassword({ email: document.querySelector("#email").value, password: document.querySelector("#password").value });
        if (error || !data.session) throw new Error("Invalid email or password.");
        await loadDashboard(data.session);
      } catch (error) { loginError.textContent = error.message || "Unable to sign in."; }
      finally { button.disabled = false; }
    });

    document.querySelector("#logout").addEventListener("click", async () => { await supabase.auth.signOut(); showLogin(); });
    document.querySelector("#dashboard-search").addEventListener("input", renderAttempts);
    document.querySelector("#export").addEventListener("click", () => {
      const fields = ["name", "class_name", "school_name", "city", "email", "score", "seconds", "submitted_at"];
      const csv = [fields.join(","), ...filteredAttempts.map((row) => fields.map((field) => `"${String(row[field] ?? "").replaceAll('"', '""')}"`).join(","))].join("\n");
      const url = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" })); const a = document.createElement("a"); a.href = url; a.download = "diwali_crossword_scores.csv"; a.click(); URL.revokeObjectURL(url);
    });
    initialise();
  </script>
</body>
</html>
